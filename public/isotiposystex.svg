<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="systexBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081420" />
      <stop offset="85%" stop-color="#04080D" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="neonGlowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Disc Background -->
  <circle cx="50" cy="50" r="48" fill="url(#systexBgGrad)" />

  <!-- Outer Neon Cyan Ring -->
  <circle
    cx="50"
    cy="50"
    r="44"
    fill="none"
    stroke="url(#neonCyanGrad)"
    stroke-width="2.5"
    filter="url(#neonGlowEffect)"
  />

  <!-- Inner Soft Ring Accent -->
  <circle
    cx="50"
    cy="50"
    r="40"
    fill="none"
    stroke="#00F0FF"
    stroke-opacity="0.2"
    stroke-width="0.75"
    stroke-dasharray="3 3"
  />

  <!-- Glow Underlayer for S Isotipo -->
  <path
    d="M 66 32 C 66 22 58 18 50 18 C 38 18 30 26 30 36 C 30 46 42 48 50 50 C 58 52 70 54 70 64 C 70 74 62 82 50 82 C 42 82 34 78 34 68"
    fill="none"
    stroke="#00F0FF"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.5"
    filter="url(#neonGlowEffect)"
  />

  <!-- Main Neon Cyan S Stroke -->
  <path
    d="M 66 32 C 66 22 58 18 50 18 C 38 18 30 26 30 36 C 30 46 42 48 50 50 C 58 52 70 54 70 64 C 70 74 62 82 50 82 C 42 82 34 78 34 68"
    fill="none"
    stroke="url(#neonCyanGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bright Core Highlight Line -->
  <path
    d="M 66 32 C 66 22 58 18 50 18 C 38 18 30 26 30 36 C 30 46 42 48 50 50 C 58 52 70 54 70 64 C 70 74 62 82 50 82 C 42 82 34 78 34 68"
    fill="none"
    stroke="#E0F7FA"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />
</svg>
